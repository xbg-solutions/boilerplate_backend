name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must be >= 22.12: uuid 14 and jose 6 are ESM-only, and require(ESM)
          # does not exist before that. Earlier 22.x fails at runtime with
          # ERR_REQUIRE_ESM.
          node-version: '22.12'
          cache: npm

      # Deliberately NOT --legacy-peer-deps. A peer conflict is a real defect:
      # firebase-functions 6 peer-required firebase-admin ^11-^13 while the repo
      # declared ^14, and that mismatch reached main because nothing checked it.
      - name: Install (strict peer resolution)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # High and above only, and the justification is about the CURRENT surface rather
      # than about one advisory. As at 2026-09-11 this tree reports fourteen moderate
      # findings and no high one; the fourteen are four advisories and the ten packages
      # that depend on them:
      #
      #   uuid <11.1.1           GHSA-w5hq-g745-h8pq   not reachable — it affects v3/v5/v6
      #                                                when passed a buffer, and both
      #                                                consumers call v4() only. Arrives
      #                                                under firebase-admin.
      #   qs <=6.15.3            GHSA-x5fp-wj9c-mxmx   under express and body-parser
      #                          GHSA-4mjr-xmp4-gh2g
      #   decode-uri-component   GHSA-vcc3-ghjq-m6fr   under query-string
      #   csv-parse <7.0.2       GHSA-8cw4-87c7-c6xx   under jsforce, an example integration
      #
      # Each arrives transitively through a dependency this repo does not choose, and the
      # only fixes npm offers for them are `--force` majors (firebase-functions@4,
      # jsforce@1.6). Failing on those permanently would train everyone to widen the
      # threshold or to stop reading the output, which costs more than the advisories do.
      #
      # A HIGH one is a different matter and is not excepted here. js-yaml 3.0.0-3.15.1
      # (GHSA-2883-xcg3-v3hh), dev-only and transitive under ts-jest's coverage tooling,
      # was fixed in place on 2026-09-11 by moving it to 3.15.2 INSIDE its existing
      # `^3.13.1` range — a three-line lockfile change, no manifest edit, no override.
      # That is the rule this step encodes: a fix available within the declared ranges
      # gets taken rather than reasoned around. Keep this list current when it changes —
      # a stale justification is worse than none, because it reads as though somebody
      # considered the finding and cleared it.
      - name: Audit
        run: npm audit --audit-level=high

  functions:
    # The reference application, and the tree that carries the generated mirror of
    # utils-content-crypto. It is NOT a workspace — `functions` is absent from the root
    # `workspaces` array, so root `npm ci` does not install it, root `npm run build` does
    # not compile it, root `jest` does not discover it, and `eslint.config.js` lists
    # `functions/**` in `ignores`. It has therefore never been gated here, and the mirror
    # it holds is today executed by nothing in CI.
    #
    # Measured before it was turned on, so the "this will surface a backlog" fear is
    # answered with a number rather than a guess: 28 suites / 812 tests / 6.45 s, all
    # passing, and `npm run build` clean (2026-09-10, working tree at d8718c9).
    #
    # Its own job rather than a step in `verify`, for two reasons: a red functions run
    # must not read as "the package build broke", and the two trees carry two different
    # lockfiles whose caches must not collide.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          # Required. `functions/package-lock.json` is a second, independent lockfile;
          # without this path both jobs would key the npm cache on the root lockfile and
          # one of them would restore the wrong node_modules.
          cache-dependency-path: functions/package-lock.json

      # `npm ci` for the same reason as the root job: the lockfile is the input, and a
      # peer conflict here is a real defect rather than something to flag past.
      - name: Install (strict peer resolution)
        run: npm ci

      # Before the tests, because `functions/tsconfig.json` excludes `**/*.test.ts` —
      # tsc and ts-jest check disjoint sets of files, so neither subsumes the other.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No audit step: this tree carries twilio, jsforce, @hubspot/api-client and
      # messagebird for the example integrations. That advisory surface belongs to a
      # reference app nobody publishes, and gating on it would train everyone to ignore
      # the step. No lint step: `functions/**` is already in eslint's `ignores`, and
      # changing that is separate work with its own diff.
